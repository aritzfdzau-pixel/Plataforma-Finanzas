name: Despliegue en GitHub Pages

on:
  push:
    branches: [main]
  # Tarea programada cada hora (minuto 17): noticias RSS y tipos de referencia del BCE
  # (el BCE publica hacia las 16:00 CET los días hábiles; el resto de horas se reutiliza).
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests antes de publicar
        run: node --test
      - name: Comprobar que el índice de fichas está al día
        run: node scripts/generar-indice.js && git diff --exit-code conocimiento/indice.json
      - uses: actions/configure-pages@v5
        id: pages
      - name: Componer el sitio (misma estructura que el repo)
        run: |
          mkdir -p _site/operativa _site/conocimiento _site/datos
          cp -r web _site/web
          cp -r operativa/lib operativa/operaciones _site/operativa/
          rsync -a --exclude '_plantilla.md' --exclude '.gitkeep' conocimiento/ _site/conocimiento/
          rsync -a --exclude 'README.md' datos/ _site/datos/
          cp web/redireccion.html _site/index.html
          touch _site/.nojekyll
      - name: Tipos de referencia del BCE → datos/tipos-bce.json (sin claves)
        # Si el BCE no responde se reutiliza el último archivo publicado; si tampoco hay,
        # se publica sin él y la web lo indica ("no disponible").
        run: |
          node scripts/descargar-bce.js _site/datos/tipos-bce.json "${{ steps.pages.outputs.base_url }}/datos/tipos-bce.json" \
            || echo "::warning::Sin tipos de referencia del BCE en esta publicación"
      - name: Noticias RSS → datos/noticias.json (sin claves; un feed caído no para la tarea)
        run: node scripts/descargar-noticias.js _site/datos/noticias.json "${{ steps.pages.outputs.base_url }}/datos/noticias.json"
      - name: Series oficiales → datos/historicos.json (BCE y Banco de España; una descarga al día)
        run: node scripts/descargar-historicos.js _site/datos/historicos.json "${{ steps.pages.outputs.base_url }}/datos/historicos.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
