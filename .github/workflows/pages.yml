name: Despliegue en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests antes de publicar
        run: node --test
      - name: Componer el sitio (web/ + datos/ + conocimiento/)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/datos _site/conocimiento
          rsync -a --exclude 'README.md' datos/ _site/datos/
          rsync -a --exclude '_plantilla.md' --exclude '.gitkeep' conocimiento/ _site/conocimiento/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
